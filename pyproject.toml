[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncrawler"
version = "0.1.0"
description = "Automated movie & series release monitoring, torrent search, and Jellyfin library management"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ncrawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/ncrawler --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ncrawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
